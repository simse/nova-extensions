name: Validate Nova Extension

on:
  workflow_call:
    inputs:
      extension-path:
        description: Path to the .novaextension directory (relative to repo root)
        required: true
        type: string

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build extension scripts
        run: npm run build

      - name: Install Nova
        run: brew install --cask nova

      - name: Validate extension
        run: |
          "/Applications/Nova.app/Contents/SharedSupport/nova" extension validate "${{ inputs.extension-path }}"
